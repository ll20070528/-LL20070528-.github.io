<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row px-3 pt-3">
                    <div class="col h5">
                        {{ include.title }}
                    </div>
                </div>
                <div class="row p-3">
                    <div class="col small">
                        {% if include.ordered %}
                        <ol class="mb-0 pl-3">
                        {% else %}
                        <ul class="mb-0 pl-3">
                        {% endif %}
                            {% for item in include.items %}
                            <li class="mb-1">{{ item }}</li>
                            {% endfor %}
                        {% if include.ordered %}
                        </ol>
                        {% else %}
                        </ul>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
