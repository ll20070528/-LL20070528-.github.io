short_bio_text_justify: true
short_bio: >-
  <p>
    蔺庆海，1993年7月，工学博士，山东交通学院副教授、硕士生导师、智慧交通系副主任。入选山东省青年科技人才托举工程。
  </p>
  <p>
    近年来，主要从事智能交通系统、交通控制与仿真、智能网联与车路协同、交通大数据分析与应用等领域研究。截至目前，主持国家自然科学基金项目1项、山东省自然科学基金项目1项；主研参与国家自然科学基金项目2项、山东省自然科学基金创新发展联合基金项目1项；主持/参与政府或企业委托横向项目10余项。以第一/通讯作者发表SCI/EI论文10余篇，其中包含IEEE T-ITS和中国公路学报等交通领域顶级期刊；授权国家发明专利5件。受邀在美国交通运输研究委员会年会（TRB）、香港运输与交通工程国际会议（HKSTS）、COTA国际交通科技年会（CICTP）、中国智能交通年会等国际国内主流会议上做报告多次。
  </p>
  <p>
    <strong>研究方向：</strong>智能交通系统，交通控制与仿真，智能网联与车路协同，交通大数据分析，陆空协同感知与控制
  </p>
  <p>
    <strong>主讲课程：</strong>本科生课程：交通工程学、交通大数据导论、数据分析理论与实践；研究生课程：交通流理论。
  </p>
  <p>
    <strong>备用邮箱：</strong>higher_lin@foxmail.com
  </p>

